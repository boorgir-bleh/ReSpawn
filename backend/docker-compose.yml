services:
  postgres:
    image: postgres:16-alpine
    container_name: cafe-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cafe_erp
      POSTGRES_USER: cafe_erp
      POSTGRES_PASSWORD: cafe_erp
    ports:
      - "5432:5432"
    volumes:
      - cafe_erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe_erp -d cafe_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cafe_erp_pgdata:
