server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: cafe-erp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cafe_erp}
    username: ${DB_USERNAME:cafe_erp}
    password: ${DB_PASSWORD:cafe_erp}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SHOW_SQL:false}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: ${JWT_ISSUER:cafe-erp}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin-bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:admin@cafe.local}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:ChangeMe123!}
    name: ${ADMIN_BOOTSTRAP_NAME:Cafe Admin}
    phone: ${ADMIN_BOOTSTRAP_PHONE:+10000000000}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@cafe.local}
  otp:
    length: ${OTP_LENGTH:6}
    expiration-seconds: ${OTP_EXPIRATION_SECONDS:300}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}
  upi:
    id: ${UPI_ID:cafe@upi}
    payee-name: ${UPI_PAYEE_NAME:Gaming Cafe}
    currency: ${UPI_CURRENCY:INR}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.cafeerp: ${APP_LOG_LEVEL:DEBUG}
